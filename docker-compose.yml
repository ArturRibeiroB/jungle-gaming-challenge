name: jungle-wagering

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Versão fixada: as imagens mais recentes do LocalStack exigem auth token.
  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      # Só fica healthy depois que o script de init criou as filas.
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wagering-events.fifo"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    command: ["bun", "src/infrastructure/database/migrate.ts", "up"]
    environment: &app-env
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_NAME: wagering-events.fifo
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # API HTTP + workers (consumidor SQS, publicador da outbox, referências pendentes).
  app: &app
    build: .
    init: true
    environment:
      <<: *app-env
      PORT: "3000"
      WORKERS_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
    # SIGTERM -> para de buscar mensagens, conclui as que estão em andamento, devolve o resto.
    stop_grace_period: 30s

  # Instâncias extras da mesma imagem, sem porta publicada: com o app, são 3 instâncias
  # disputando a mesma fila, a mesma outbox e as mesmas wallets.
  # Mais instâncias: docker compose up -d --scale worker=4
  worker:
    <<: *app
    ports: []
    deploy:
      replicas: 2

volumes:
  postgres-data:
